<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国鉄道駅 周辺スポットナビ（JR・私鉄・地下鉄）</title>
  <style>
    :root {
      --primary: #008000;
      --primary-hover: #006400;
      --primary-light: #ecfdf5;
      --accent: #047857;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-sub: #4b5563;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 26px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }
    .badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    p.desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 128, 0, 0.15);
    }
    select:disabled, input:disabled {
      background-color: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
      border-color: #e5e7eb;
    }
    .station-count {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 5px;
      min-height: 16px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }
    .btn {
      padding: 14px 10px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background-color 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    .btn-main {
      background: var(--primary);
      color: #ffffff;
      grid-column: span 2;
      font-size: 16px;
      padding: 15px 12px;
      box-shadow: 0 2px 8px rgba(0, 128, 0, 0.25);
    }
    .btn-main:active:not(:disabled) {
      background: var(--primary-hover);
      transform: scale(0.98);
    }
    .btn-sub {
      background: #f0fdf4;
      color: var(--primary);
      border: 1px solid #bbf7d0;
    }
    .btn-sub:active:not(:disabled) {
      background: #dcfce7;
      transform: scale(0.98);
    }
    .btn:disabled {
      background: #e5e7eb !important;
      color: #9ca3af !important;
      border: none !important;
      box-shadow: none !important;
      cursor: not-allowed;
      transform: none !important;
    }
    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge">OB会・同窓会サポートツール</span>
  <h1>全国鉄道駅 周辺スポットナビ</h1>
  <p class="desc">
    都道府県を選択後、駅名を入力してください（JR各線・私鉄・地下鉄全線対応）。<br>
    駅周辺の観光名所・バス停・カフェ・ホテル情報をワンタップでGoogleマップ検索できます。
  </p>

  <!-- 1. 都道府県選択 -->
  <div class="form-group">
    <label for="prefSelect">① 都道府県を選択</label>
    <select id="prefSelect" onchange="onPrefChange()">
      <option value="">都道府県を選択してください</option>
    </select>
  </div>

  <!-- 2. 駅名入力 -->
  <div class="form-group">
    <label for="stationInput">② 駅名を入力（候補から選択）</label>
    <input type="text" id="stationInput" list="stationList" placeholder="先に都道府県を選択してください" disabled oninput="onStationInput()">
    <datalist id="stationList"></datalist>
    <div class="station-count" id="stationCountText"></div>
  </div>

  <!-- 3. 周辺検索ボタン群 -->
  <div class="btn-grid">
    <button class="btn btn-main" id="btnMain" disabled onclick="openMap('周辺 スポット')">📍 周辺スポット全体を見る</button>
    <button class="btn btn-sub" id="btnSightseeing" disabled onclick="openMap('観光スポット 名所')">🏛️ 観光・名所旧跡</button>
    <button class="btn btn-sub" id="btnBus" disabled onclick="openMap('バス停')">🚌 バス停・のりば</button>
    <button class="btn btn-sub" id="btnCafe" disabled onclick="openMap('カフェ 喫茶店')">☕ カフェ・休憩</button>
    <button class="btn btn-sub" id="btnGourmet" disabled onclick="openMap('ランチ 居酒屋 グルメ')">🍽️ グルメ・食事</button>
    <button class="btn btn-sub" id="btnHotel" disabled onclick="openMap('ホテル 宿泊')">🏨 周辺ホテル</button>
    <button class="btn btn-sub" id="btnConvenience" disabled onclick="openMap('コンビニ')">🏪 コンビニ</button>
  </div>

  <div class="footer-note">
    ※ JR各線・私鉄・公営地下鉄・第三セクターに対応しています。
  </div>
</div>

<script>
const prefectures = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
  "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
  "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県",
  "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県",
  "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県",
  "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県",
  "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"
];

let stationData = {};

window.addEventListener("DOMContentLoaded", () => {
  const prefSelect = document.getElementById("prefSelect");
  prefectures.forEach(pref => {
    const opt = document.createElement("option");
    opt.value = pref;
    opt.textContent = pref;
    prefSelect.appendChild(opt);
  });

  fetch("stations.json")
    .then(res => res.json())
    .then(data => {
      stationData = data;
    })
    .catch(err => {
      console.warn("stations.json の読み込みに失敗しました:", err);
    });
});

function onPrefChange() {
  const pref = document.getElementById("prefSelect").value;
  const input = document.getElementById("stationInput");
  const datalist = document.getElementById("stationList");
  const countText = document.getElementById("stationCountText");

  datalist.innerHTML = "";
  input.value = "";
  setButtons(false);

  if (!pref) {
    input.disabled = true;
    input.placeholder = "先に都道府県を選択してください";
    countText.textContent = "";
    return;
  }

  const list = stationData[pref] || [];
  list.forEach(st => {
    const opt = document.createElement("option");
    opt.value = st;
    datalist.appendChild(opt);
  });

  input.disabled = false;
  input.placeholder = `${pref}の駅名を入力（例：${list[0] || "八王子"}）`;
  countText.textContent = `${pref}内の駅数：約${list.length}駅`;
  input.focus();
}

function onStationInput() {
  const val = document.getElementById("stationInput").value.trim();
  setButtons(val.length > 0);
}

function setButtons(enabled) {
  const ids = ["btnMain", "btnSightseeing", "btnBus", "btnCafe", "btnGourmet", "btnHotel", "btnConvenience"];
  ids.forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = !enabled;
  });
}

function openMap(category) {
  const pref = document.getElementById("prefSelect").value;
  let station = document.getElementById("stationInput").value.trim();
  if (!station) return;

  if (!station.endsWith("駅")) {
    station += "駅";
  }

  // 「都道府県 駅名 目的スポット」で正確にスポット一覧を検索（経路検索の誤作動を防止）
  const query = encodeURIComponent(`${pref} ${station} ${category}`);
  const url = `https://www.google.com/maps/search/?api=1&query=${query}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
